<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="base" cx="50%" cy="30%" r="92%">
      <stop offset="0%" stop-color="#2C1349"/>
      <stop offset="52%" stop-color="#170B28"/>
      <stop offset="100%" stop-color="#0A0610"/>
    </radialGradient>
    <radialGradient id="bloom" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C77DFF" stop-opacity="0.45"/>
      <stop offset="55%" stop-color="#9D4EDD" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#9D4EDD" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="word" x1="0.1" y1="0.1" x2="0.55" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E6CCFF"/>
    </linearGradient>
    <linearGradient id="plus" x1="0.16" y1="0.12" x2="0.84" y2="0.9">
      <stop offset="0%" stop-color="#F0DBFF"/>
      <stop offset="42%" stop-color="#C77DFF"/>
      <stop offset="100%" stop-color="#8B3FD4"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="24%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#base)"/>
  <rect x="2.5" y="2.5" width="507" height="507" rx="113.5" fill="none" stroke="#C77DFF" stroke-opacity="0.20" stroke-width="1.5"/>
  <ellipse cx="256" cy="252" rx="200" ry="160" fill="url(#bloom)"/>

  <!-- DASH wordmark (caps) + signature violet + -->
  <text x="252" y="260" text-anchor="middle" dominant-baseline="central"
        font-family="'Space Grotesk','Clash Display','Outfit',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif"
        font-weight="800" font-size="150" letter-spacing="-4">
    <tspan fill="url(#word)">DASH</tspan><tspan fill="url(#plus)" dx="2" font-size="168">+</tspan>
  </text>

  <rect width="512" height="512" rx="116" fill="url(#sheen)"/>
</svg>
