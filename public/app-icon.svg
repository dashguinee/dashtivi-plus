<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Premium base: deep violet -> near-black, top-lit -->
    <radialGradient id="base" cx="50%" cy="30%" r="92%">
      <stop offset="0%" stop-color="#2C1349"/>
      <stop offset="52%" stop-color="#170B28"/>
      <stop offset="100%" stop-color="#0A0610"/>
    </radialGradient>
    <!-- Signature bloom behind the mark (the app's glow) -->
    <radialGradient id="bloom" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C77DFF" stop-opacity="0.55"/>
      <stop offset="52%" stop-color="#9D4EDD" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#9D4EDD" stop-opacity="0"/>
    </radialGradient>
    <!-- The "+" : white-lilac (top-left light) -> deep violet (bottom-right) = depth -->
    <linearGradient id="plus" x1="0.16" y1="0.12" x2="0.84" y2="0.9">
      <stop offset="0%" stop-color="#FBF0FF"/>
      <stop offset="42%" stop-color="#C77DFF"/>
      <stop offset="100%" stop-color="#8B3FD4"/>
    </linearGradient>
    <!-- Glass sheen across the tile -->
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="24%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Base squircle -->
  <rect width="512" height="512" rx="116" fill="url(#base)"/>
  <!-- Hairline for definition -->
  <rect x="2.5" y="2.5" width="507" height="507" rx="113.5" fill="none" stroke="#C77DFF" stroke-opacity="0.20" stroke-width="1.5"/>
  <!-- Bloom -->
  <ellipse cx="256" cy="252" rx="196" ry="196" fill="url(#bloom)"/>
  <!-- The signature "+" mark, centered, rounded ends -->
  <g fill="url(#plus)">
    <rect x="218" y="124" width="76" height="264" rx="34"/>
    <rect x="124" y="218" width="264" height="76" rx="34"/>
  </g>
  <!-- Glass sheen on top -->
  <rect width="512" height="512" rx="116" fill="url(#sheen)"/>
</svg>
