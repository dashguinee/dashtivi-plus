<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Deep base: splash-screen space-black -->
    <radialGradient id="base" cx="50%" cy="38%" r="78%">
      <stop offset="0%"  stop-color="#1B0E33"/>
      <stop offset="42%" stop-color="#0C0717"/>
      <stop offset="100%" stop-color="#060609"/>
    </radialGradient>
    <!-- Signature violet -> lilac plus (matches the in-logo "+") -->
    <linearGradient id="plus" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%"  stop-color="#D9A4FF"/>
      <stop offset="38%" stop-color="#C77DFF"/>
      <stop offset="100%" stop-color="#9D4EDD"/>
    </linearGradient>
    <!-- Soft inner top-light for premium depth -->
    <linearGradient id="sheen" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%"  stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="26" result="b"/>
      <feColorMatrix in="b" type="matrix"
        values="0 0 0 0 0.616  0 0 0 0 0.306  0 0 0 0 0.867  0 0 0 0.6 0"/>
    </filter>
  </defs>

  <!-- Full-bleed base (maskable-safe: content lives in the centre) -->
  <rect width="1024" height="1024" fill="url(#base)"/>

  <!-- Faint violet ambience ring echoing the splash pulse -->
  <circle cx="512" cy="430" r="300" fill="none" stroke="#9D4EDD" stroke-opacity="0.06" stroke-width="2"/>

  <!-- The signature "+" — geometric, rounded terminals, brand gradient -->
  <g>
    <!-- glow underlay -->
    <g filter="url(#glow)" opacity="0.9">
      <rect x="452" y="330" width="120" height="364" rx="58"/>
      <rect x="330" y="452" width="364" height="120" rx="58"/>
    </g>
    <!-- solid mark -->
    <g fill="url(#plus)">
      <rect x="452" y="330" width="120" height="364" rx="58"/>
      <rect x="330" y="452" width="364" height="120" rx="58"/>
    </g>
    <!-- top-light sheen -->
    <g fill="url(#sheen)">
      <rect x="452" y="330" width="120" height="364" rx="58"/>
      <rect x="330" y="452" width="364" height="120" rx="58"/>
    </g>
  </g>
</svg>
